name: Validate Estate Corruption source
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tools and build pipeline (no EU5 engine)
        run: python -m unittest discover -s tests -v
